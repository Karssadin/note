name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes repo
        uses: actions/checkout@v4

      - name: Checkout Quartz v4
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quartz-src/package-lock.json

      - name: Sync notes to Quartz content
        run: |
          rm -rf quartz-src/content
          mkdir -p quartz-src/content
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude 'quartz-src/' \
            --exclude 'site/' \
            --exclude 'public/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '_docs/' \
            --exclude 'template/' \
            ./ quartz-src/content/

      - name: Set notes list as homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("quartz-src/content")
          src = root / "笔记列表.md"
          dst = root / "index.md"
          if src.exists():
              dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Render custom relation fields
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          ROOT = Path("quartz-src/content")
          MARK_START = "<!-- quartz-rel-start -->"
          MARK_END = "<!-- quartz-rel-end -->"

          def strip_quotes(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and ((value[0] == value[-1]) and value[0] in ("'", '"')):
                  return value[1:-1].strip()
              return value

          def parse_frontmatter_lists(frontmatter: str):
              lines = frontmatter.splitlines()
              data = []
              i = 0
              while i < len(lines):
                  raw = lines[i]
                  m = re.match(r"^([A-Za-z_][A-Za-z0-9_-]*):\s*$", raw)
                  if not m:
                      i += 1
                      continue
                  key = m.group(1)
                  i += 1
                  values = []
                  while i < len(lines):
                      line = lines[i]
                      if not line.startswith(" ") and not line.startswith("\t"):
                          break
                      list_match = re.match(r"^\s*-\s*(.+?)\s*$", line)
                      if list_match:
                          value = strip_quotes(list_match.group(1))
                          if value:
                              values.append(value)
                      i += 1
                  if values:
                      data.append((key, values))
              return data

          def to_wikilink(text: str) -> str:
              text = text.strip()
              if text.startswith("[[") and text.endswith("]]"):
                  return text
              return f"[[{text}]]"

          def inject_block(body: str, rel):
              body = re.sub(
                  rf"{re.escape(MARK_START)}.*?{re.escape(MARK_END)}\n?",
                  "",
                  body,
                  flags=re.S,
              ).lstrip("\n")

              lines = []
              for key, values in rel:
                  lines.append(f"- {key}: {'、'.join(to_wikilink(x) for x in values)}")
              if not lines:
                  return body

              block = "\n".join(
                  [MARK_START, *lines, "", "---", MARK_END, ""]
              )
              return f"{block}\n{body}"

          for md in ROOT.rglob("*.md"):
              text = md.read_text(encoding="utf-8", errors="ignore")
              m = re.match(r"^---\n(.*?)\n---\n?", text, flags=re.S)
              if not m:
                  continue
              frontmatter = m.group(1)
              body = text[m.end():]
              rel = parse_frontmatter_lists(frontmatter)
              if not rel:
                  continue
              new_body = inject_block(body, rel)
              md.write_text(text[:m.end()] + new_body, encoding="utf-8")
          PY

      - name: Patch Quartz labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          en = Path("quartz-src/quartz/i18n/locales/en-US.ts")
          text = en.read_text(encoding="utf-8")
          text = text.replace('title: "Backlinks"', 'title: "连接到当前文件"')
          en.write_text(text, encoding="utf-8")
          PY

      - name: Remove hierarchy navigation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          layout = Path("quartz-src/quartz.layout.ts")
          text = layout.read_text(encoding="utf-8")
          text = re.sub(
              r'\s*Component\.ConditionalRender\(\{\n(?:\s*component: Component\.Breadcrumbs\(\),\n)?\s*condition: \(page\) => page\.fileData\.slug !== "index",\n\s*\}\),\n',
              '\n',
              text,
          )
          text = text.replace('beforeBody: [Component.Breadcrumbs(), Component.ArticleTitle(), Component.ContentMeta()],',
                              'beforeBody: [Component.ArticleTitle(), Component.ContentMeta()],')
          text = text.replace(
              'Component.Graph(),',
              'Component.Graph({ localGraph: { depth: 3 } }),'
          )
          layout.write_text(text, encoding="utf-8")
          PY

      - name: Apply theme preset C1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg_path = Path("quartz-src/quartz.config.ts")
          cfg = cfg_path.read_text(encoding="utf-8")
          cfg = cfg.replace('locale: "zh-CN"', 'locale: "en-US"')
          cfg = cfg.replace('header: "Schibsted Grotesk"', 'header: "Noto Serif SC"')
          cfg = cfg.replace('body: "Source Sans Pro"', 'body: "Noto Sans SC"')
          cfg = cfg.replace('code: "IBM Plex Mono"', 'code: "JetBrains Mono"')
          cfg = cfg.replace('secondary: "#284b63"', 'secondary: "#2f6f7e"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#5fa08e"')
          cfg = cfg.replace('secondary: "#7b97aa"', 'secondary: "#8bc2cf"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#7fd7be"')
          cfg_path.write_text(cfg, encoding="utf-8")

          css_path = Path("quartz-src/quartz/styles/custom.scss")
          css = (
              '@use "./base.scss";\n\n'
              '/* C preset: garden-network visual style */\n'
              ':root {\n'
              '  --radius-soft: 10px;\n'
              '}\n\n'
              '.page-title,\n'
              'h1, h2, h3 {\n'
              '  letter-spacing: 0.01em;\n'
              '}\n\n'
              'a.internal {\n'
              '  text-underline-offset: 0.18em;\n'
              '  text-decoration-thickness: 0.08em;\n'
              '}\n\n'
              '.popover,\n'
              '.backlinks,\n'
              '.toc,\n'
              '.recent-notes {\n'
              '  border-radius: var(--radius-soft);\n'
              '  border: 1px solid var(--lightgray);\n'
              '  box-shadow: 0 3px 14px color-mix(in srgb, var(--dark) 8%, transparent);\n'
              '}\n\n'
              '.graph,\n'
              '#graph-container {\n'
              '  border-radius: var(--radius-soft);\n'
              '  border: 1px solid var(--lightgray);\n'
              '  background:\n'
              '    radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--tertiary) 18%, transparent), transparent 40%),\n'
              '    radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--secondary) 18%, transparent), transparent 38%);\n'
              '}\n'
          )
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz site
        working-directory: quartz-src
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
