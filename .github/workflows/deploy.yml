name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes repo
        uses: actions/checkout@v4

      - name: Checkout Quartz v4
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quartz-src/package-lock.json

      - name: Sync notes to Quartz content
        run: |
          rm -rf quartz-src/content
          mkdir -p quartz-src/content
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude 'quartz-src/' \
            --exclude 'site/' \
            --exclude 'public/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '_docs/' \
            ./ quartz-src/content/

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz site
        working-directory: quartz-src
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
