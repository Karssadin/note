name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes repo
        uses: actions/checkout@v4

      - name: Checkout Quartz v4
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quartz-src/package-lock.json

      - name: Sync notes to Quartz content
        run: |
          rm -rf quartz-src/content
          mkdir -p quartz-src/content
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude 'quartz-src/' \
            --exclude 'site/' \
            --exclude 'public/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '_docs/' \
            ./ quartz-src/content/

      - name: Render custom relation fields
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          ROOT = Path("quartz-src/content")
          TARGET_KEYS = ("up", "down", "relation", "tags")
          MARK_START = "<!-- quartz-rel-start -->"
          MARK_END = "<!-- quartz-rel-end -->"

          def strip_quotes(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and ((value[0] == value[-1]) and value[0] in ("'", '"')):
                  return value[1:-1].strip()
              return value

          def parse_frontmatter_lists(frontmatter: str):
              lines = frontmatter.splitlines()
              data = {k: [] for k in TARGET_KEYS}
              i = 0
              while i < len(lines):
                  raw = lines[i]
                  m = re.match(r"^([A-Za-z_][A-Za-z0-9_-]*):\s*$", raw)
                  if not m:
                      i += 1
                      continue
                  key = m.group(1)
                  i += 1
                  if key not in data:
                      while i < len(lines) and (lines[i].startswith(" ") or lines[i].startswith("\t")):
                          i += 1
                      continue
                  while i < len(lines):
                      line = lines[i]
                      if not line.startswith(" ") and not line.startswith("\t"):
                          break
                      list_match = re.match(r"^\s*-\s*(.+?)\s*$", line)
                      if list_match:
                          value = strip_quotes(list_match.group(1))
                          if value:
                              data[key].append(value)
                      i += 1
              return data

          def to_wikilink(text: str) -> str:
              text = text.strip()
              if text.startswith("[[") and text.endswith("]]"):
                  return text
              return f"[[{text}]]"

          def inject_block(body: str, rel):
              body = re.sub(
                  rf"{re.escape(MARK_START)}.*?{re.escape(MARK_END)}\n?",
                  "",
                  body,
                  flags=re.S,
              ).lstrip("\n")

              lines = []
              if rel["up"]:
                  lines.append(f"- 上层：{'、'.join(to_wikilink(x) for x in rel['up'])}")
              if rel["down"]:
                  lines.append(f"- 下层：{'、'.join(to_wikilink(x) for x in rel['down'])}")
              if rel["relation"]:
                  lines.append(f"- 关联：{'、'.join(to_wikilink(x) for x in rel['relation'])}")
              if rel["tags"]:
                  lines.append(f"- 标签：{'、'.join(to_wikilink(x) for x in rel['tags'])}")
              if not lines:
                  return body

              block = "\n".join(
                  [MARK_START, *lines, "", "---", MARK_END, ""]
              )
              return f"{block}\n{body}"

          for md in ROOT.rglob("*.md"):
              text = md.read_text(encoding="utf-8", errors="ignore")
              m = re.match(r"^---\n(.*?)\n---\n?", text, flags=re.S)
              if not m:
                  continue
              frontmatter = m.group(1)
              body = text[m.end():]
              rel = parse_frontmatter_lists(frontmatter)
              if not any(rel.values()):
                  continue
              new_body = inject_block(body, rel)
              md.write_text(text[:m.end()] + new_body, encoding="utf-8")
          PY

      - name: Patch Quartz labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          zh = Path("quartz-src/quartz/i18n/locales/zh-CN.ts")
          text = zh.read_text(encoding="utf-8")
          text = text.replace('title: "反向链接"', 'title: "连接到当前文件"')
          text = text.replace('noBacklinksFound: "无法找到反向链接"', 'noBacklinksFound: "暂无连接到当前文件的内容"')
          zh.write_text(text, encoding="utf-8")
          PY

      - name: Apply theme preset C1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg_path = Path("quartz-src/quartz.config.ts")
          cfg = cfg_path.read_text(encoding="utf-8")
          cfg = cfg.replace('locale: "en-US"', 'locale: "zh-CN"')
          cfg = cfg.replace('header: "Schibsted Grotesk"', 'header: "Noto Serif SC"')
          cfg = cfg.replace('body: "Source Sans Pro"', 'body: "Noto Sans SC"')
          cfg = cfg.replace('code: "IBM Plex Mono"', 'code: "JetBrains Mono"')
          cfg = cfg.replace('secondary: "#284b63"', 'secondary: "#2f6f7e"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#5fa08e"')
          cfg = cfg.replace('secondary: "#7b97aa"', 'secondary: "#8bc2cf"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#7fd7be"')
          cfg_path.write_text(cfg, encoding="utf-8")

          css_path = Path("quartz-src/quartz/styles/custom.scss")
          css_path.write_text(
              """@use "./base.scss";

/* C preset: garden-network visual style */
:root {
  --radius-soft: 10px;
}

.page-title,
h1, h2, h3 {
  letter-spacing: 0.01em;
}

a.internal {
  text-underline-offset: 0.18em;
  text-decoration-thickness: 0.08em;
}

.popover,
.backlinks,
.toc,
.recent-notes {
  border-radius: var(--radius-soft);
  border: 1px solid var(--lightgray);
  box-shadow: 0 3px 14px color-mix(in srgb, var(--dark) 8%, transparent);
}

.graph,
#graph-container {
  border-radius: var(--radius-soft);
  border: 1px solid var(--lightgray);
  background:
    radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--tertiary) 18%, transparent), transparent 40%),
    radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--secondary) 18%, transparent), transparent 38%);
}
""",
              encoding="utf-8",
          )
          PY

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz site
        working-directory: quartz-src
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
