name: Deploy Quartz to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout notes repo
        uses: actions/checkout@v4

      - name: Checkout Quartz v4
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4
          path: quartz-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: quartz-src/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install lzstring

      - name: Sync notes to Quartz content
        run: |
          rm -rf quartz-src/content
          mkdir -p quartz-src/content
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.obsidian/' \
            --exclude 'quartz-src/' \
            --exclude 'site/' \
            --exclude 'public/' \
            --exclude 'dist/' \
            --exclude 'node_modules/' \
            --exclude '_docs/' \
            --exclude 'template/' \
            ./ quartz-src/content/

      - name: Set notes list as homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("quartz-src/content")
          src = root / "笔记列表.md"
          dst = root / "index.md"
          if src.exists():
              dst.write_text(src.read_text(encoding="utf-8"), encoding="utf-8")
          PY

      - name: Render custom relation fields
        run: |
          python3 - <<'PY'
          import json
          import html
          import re
          from pathlib import Path

          ROOT = Path("quartz-src/content")
          MARK_START = "<!-- quartz-rel-start -->"
          MARK_END = "<!-- quartz-rel-end -->"

          def strip_quotes(value: str) -> str:
              value = value.strip()
              if len(value) >= 2 and ((value[0] == value[-1]) and value[0] in ("'", '"')):
                  return value[1:-1].strip()
              return value

          def parse_frontmatter_items(frontmatter: str):
              lines = frontmatter.splitlines()
              data = []
              i = 0
              while i < len(lines):
                  raw = lines[i]
                  m = re.match(r"^([A-Za-z_][A-Za-z0-9_-]*):\s*(.*?)\s*$", raw)
                  if not m:
                      i += 1
                      continue
                  key = m.group(1)
                  inline = strip_quotes(m.group(2))

                  values = []
                  # keep list fields auto-discovered, and also include link/url scalar
                  if inline and key.lower() in {"link", "url"}:
                      data.append((key, [inline]))
                      i += 1
                      continue

                  i += 1
                  while i < len(lines):
                      line = lines[i]
                      if not line.startswith(" ") and not line.startswith("\t"):
                          break
                      list_match = re.match(r"^\s*-\s*(.+?)\s*$", line)
                      if list_match:
                          value = strip_quotes(list_match.group(1))
                          if value:
                              values.append(value)
                      i += 1
                  if values:
                      data.append((key, values))
              return data

          def is_url(text: str) -> bool:
              return bool(re.match(r"^https?://", text.strip(), flags=re.I))

          def format_value(text: str) -> str:
              text = text.strip()
              if not text:
                  return text
              if is_url(text):
                  return f"[{text}]({text})"
              if text.startswith("[[") and text.endswith("]]"):
                  return text
              return f"[[{text}]]"

          def inject_block(body: str, rel):
              body = re.sub(
                  rf"{re.escape(MARK_START)}.*?{re.escape(MARK_END)}\n?",
                  "",
                  body,
                  flags=re.S,
              ).lstrip("\n")

              lines = []
              for key, values in rel:
                  lines.append(f"- {key}: {'、'.join(format_value(x) for x in values)}")
              if not lines:
                  return body

              block = "\n".join(
                  [MARK_START, *lines, "", "---", MARK_END, ""]
              )
              return f"{block}\n{body}"

          def esc(text: str) -> str:
              return html.escape(str(text), quote=True)

          def normalize_canvas_color(c):
              if isinstance(c, str) and c.startswith("#") and len(c) in (4, 7):
                  return c
              return "#e2e8f0"

          def render_canvas_svg(data: dict) -> str:
              nodes = data.get("nodes", []) if isinstance(data, dict) else []
              edges = data.get("edges", []) if isinstance(data, dict) else []
              if not nodes:
                  return (
                      '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300">'
                      '<rect width="100%" height="100%" fill="#ffffff"/>'
                      '<text x="32" y="56" font-size="24" fill="#334155">Canvas is empty</text>'
                      "</svg>"
                  )

              min_x = min(float(n.get("x", 0)) for n in nodes)
              min_y = min(float(n.get("y", 0)) for n in nodes)
              max_x = max(float(n.get("x", 0)) + float(n.get("width", 320)) for n in nodes)
              max_y = max(float(n.get("y", 0)) + float(n.get("height", 180)) for n in nodes)
              pad = 80.0
              vw = max(1200.0, max_x - min_x + pad * 2)
              vh = max(700.0, max_y - min_y + pad * 2)

              id2node = {str(n.get("id")): n for n in nodes if n.get("id") is not None}
              out = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {vw:.1f} {vh:.1f}">',
                  '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>',
                  '<rect width="100%" height="100%" fill="#ffffff"/>',
              ]

              def center(n):
                  x = float(n.get("x", 0)) - min_x + pad
                  y = float(n.get("y", 0)) - min_y + pad
                  w = float(n.get("width", 320))
                  h = float(n.get("height", 180))
                  return (x + w / 2.0, y + h / 2.0)

              for e in edges:
                  frm = id2node.get(str(e.get("fromNode")))
                  to = id2node.get(str(e.get("toNode")))
                  if not frm or not to:
                      continue
                  x1, y1 = center(frm)
                  x2, y2 = center(to)
                  out.append(
                      f'<line x1="{x1:.1f}" y1="{y1:.1f}" x2="{x2:.1f}" y2="{y2:.1f}" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>'
                  )

              for n in nodes:
                  x = float(n.get("x", 0)) - min_x + pad
                  y = float(n.get("y", 0)) - min_y + pad
                  w = max(40.0, float(n.get("width", 320)))
                  h = max(32.0, float(n.get("height", 180)))
                  color = normalize_canvas_color(n.get("color"))
                  ntype = str(n.get("type", "text"))
                  text = str(n.get("text", "")).strip()
                  if not text and ntype == "file":
                      text = str(n.get("file", "")).split("/")[-1]
                  if not text and ntype == "link":
                      text = str(n.get("url", "link"))
                  if not text:
                      text = ntype

                  out.append(
                      f'<rect x="{x:.1f}" y="{y:.1f}" width="{w:.1f}" height="{h:.1f}" rx="10" ry="10" fill="{esc(color)}" fill-opacity="0.15" stroke="#334155" stroke-width="1.4"/>'
                  )
                  lines = text.splitlines()[:8]
                  ty = y + 26
                  for ln in lines:
                      out.append(f'<text x="{x+14:.1f}" y="{ty:.1f}" font-size="16" fill="#0f172a">{esc(ln[:80])}</text>')
                      ty += 22

              out.append("</svg>")
              return "\n".join(out)

          def render_excalidraw_svg(scene: dict) -> str:
              elements = scene.get("elements", []) if isinstance(scene, dict) else []
              visible = [e for e in elements if not e.get("isDeleted")]
              if not visible:
                  return (
                      '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300">'
                      '<rect width="100%" height="100%" fill="#ffffff"/>'
                      '<text x="32" y="56" font-size="24" fill="#334155">Excalidraw is empty</text>'
                      "</svg>"
                  )

              min_x = min(float(e.get("x", 0)) for e in visible)
              min_y = min(float(e.get("y", 0)) for e in visible)
              max_x = max(float(e.get("x", 0)) + abs(float(e.get("width", 0) or 0)) + 20 for e in visible)
              max_y = max(float(e.get("y", 0)) + abs(float(e.get("height", 0) or 0)) + 20 for e in visible)
              pad = 80.0
              vw = max(1200.0, max_x - min_x + pad * 2)
              vh = max(700.0, max_y - min_y + pad * 2)

              out = [
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {vw:.1f} {vh:.1f}">',
                  '<defs><marker id="arrx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>',
                  '<rect width="100%" height="100%" fill="#ffffff"/>',
              ]

              for e in visible:
                  t = str(e.get("type", ""))
                  x = float(e.get("x", 0)) - min_x + pad
                  y = float(e.get("y", 0)) - min_y + pad
                  w = abs(float(e.get("width", 0) or 0))
                  h = abs(float(e.get("height", 0) or 0))
                  stroke = esc(e.get("strokeColor") or "#1f2937")
                  fill = esc(e.get("backgroundColor") or "none")
                  sw = max(1.0, float(e.get("strokeWidth", 1) or 1))

                  if t == "rectangle":
                      out.append(f'<rect x="{x:.1f}" y="{y:.1f}" width="{w:.1f}" height="{h:.1f}" rx="8" ry="8" fill="{fill}" stroke="{stroke}" stroke-width="{sw:.1f}"/>')
                  elif t == "ellipse":
                      out.append(f'<ellipse cx="{x+w/2:.1f}" cy="{y+h/2:.1f}" rx="{w/2:.1f}" ry="{h/2:.1f}" fill="{fill}" stroke="{stroke}" stroke-width="{sw:.1f}"/>')
                  elif t == "diamond":
                      p = f"{x+w/2:.1f},{y:.1f} {x+w:.1f},{y+h/2:.1f} {x+w/2:.1f},{y+h:.1f} {x:.1f},{y+h/2:.1f}"
                      out.append(f'<polygon points="{p}" fill="{fill}" stroke="{stroke}" stroke-width="{sw:.1f}"/>')
                  elif t in {"line", "arrow"}:
                      pts = e.get("points") or []
                      if not pts:
                          continue
                      abs_pts = []
                      for pt in pts:
                          if isinstance(pt, list) and len(pt) >= 2:
                              abs_pts.append((x + float(pt[0]), y + float(pt[1])))
                      if len(abs_pts) >= 2:
                          ps = " ".join(f"{px:.1f},{py:.1f}" for px, py in abs_pts)
                          marker = ' marker-end="url(#arrx)"' if t == "arrow" else ""
                          out.append(f'<polyline points="{ps}" fill="none" stroke="{stroke}" stroke-width="{sw:.1f}"{marker}/>')
                  elif t == "text":
                      txt = str(e.get("text", "")).splitlines()
                      fs = max(12, int(float(e.get("fontSize", 20) or 20)))
                      ty = y + fs
                      for ln in txt[:12]:
                          out.append(f'<text x="{x:.1f}" y="{ty:.1f}" font-size="{fs}" fill="{stroke}">{esc(ln[:120])}</text>')
                          ty += fs + 4

              out.append("</svg>")
              return "\n".join(out)

          for md in ROOT.rglob("*.md"):
              text = md.read_text(encoding="utf-8", errors="ignore")
              m = re.match(r"^---\n(.*?)\n---\n?", text, flags=re.S)
              if not m:
                  continue
              frontmatter = m.group(1)
              body = text[m.end():]
              rel = parse_frontmatter_items(frontmatter)
              if not rel:
                  continue
              new_body = inject_block(body, rel)
              md.write_text(text[:m.end()] + new_body, encoding="utf-8")

          # Build publishable pages for Obsidian whiteboards (.canvas)
          for canvas in ROOT.rglob("*.canvas"):
              try:
                  data = json.loads(canvas.read_text(encoding="utf-8", errors="ignore"))
              except Exception:
                  continue
              svg = render_canvas_svg(data)
              svg_name = canvas.name + ".svg"
              svg_path = canvas.with_name(svg_name)
              svg_path.write_text(svg, encoding="utf-8")

              page_path = canvas.with_name(canvas.name + ".md")
              title = canvas.stem
              page = (
                  f"---\n"
                  f"title: {title}\n"
                  f"---\n\n"
                  f"![{title}]({svg_name})\n\n"
                  f"> source: `{canvas.name}`\n"
              )
              page_path.write_text(page, encoding="utf-8")

          # Render Excalidraw drawings to SVG for publish pages
          from lzstring import LZString

          EX_START = "<!-- quartz-excalidraw-preview-start -->"
          EX_END = "<!-- quartz-excalidraw-preview-end -->"
          lzs = LZString()

          for md in ROOT.rglob("*.md"):
              text = md.read_text(encoding="utf-8", errors="ignore")
              fm = re.match(r"^---\n(.*?)\n---\n?", text, flags=re.S)
              if not fm:
                  continue
              frontmatter = fm.group(1)
              body = text[fm.end():]
              has_excalidraw_marker = bool(
                  re.search(r"(?mi)^\s*excalidraw-plugin:\s*parsed\s*$", frontmatter)
              )
              has_excalidraw_tag = bool(
                  re.search(r"(?mi)^\s*tags:\s*\[.*\bexcalidraw\b.*\]\s*$", frontmatter)
              )
              has_excalidraw_hint = (
                  has_excalidraw_marker
                  or has_excalidraw_tag
                  or "# Excalidraw Data" in body
                  or "```compressed-json" in body
              )
              if not has_excalidraw_hint:
                  continue

              m = re.search(r"```compressed-json\s+([\s\S]*?)```", body, flags=re.S)
              if not m:
                  continue
              payload = re.sub(r"\s+", "", m.group(1))
              raw = lzs.decompressFromBase64(payload)
              if not raw:
                  continue
              try:
                  scene = json.loads(raw)
              except Exception:
                  continue

              svg_name = md.stem + ".excalidraw.svg"
              svg_path = md.with_name(svg_name)
              svg_path.write_text(render_excalidraw_svg(scene), encoding="utf-8")

              preview = "\n".join(
                  [
                      EX_START,
                      f"![{md.stem}]({svg_name})",
                      EX_END,
                      "",
                  ]
              )
              cleaned = re.sub(
                  rf"{re.escape(EX_START)}.*?{re.escape(EX_END)}\n?",
                  "",
                  body,
                  flags=re.S,
              ).lstrip("\n")
              cleaned = re.sub(
                  r"# Excalidraw Data[\s\S]*$",
                  "",
                  cleaned,
                  flags=re.S,
              ).rstrip()
              if cleaned:
                  cleaned = f"{preview}\n{cleaned}\n"
              else:
                  cleaned = f"{preview}\n"
              md.write_text(text[:fm.end()] + cleaned, encoding="utf-8")
          PY

      - name: Patch Quartz labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          en = Path("quartz-src/quartz/i18n/locales/en-US.ts")
          text = en.read_text(encoding="utf-8")
          text = text.replace('title: "Backlinks"', 'title: "连接到当前文件"')
          en.write_text(text, encoding="utf-8")
          PY

      - name: Remove hierarchy navigation
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          layout = Path("quartz-src/quartz.layout.ts")
          text = layout.read_text(encoding="utf-8")
          text = re.sub(
              r'\s*Component\.ConditionalRender\(\{\n(?:\s*component: Component\.Breadcrumbs\(\),\n)?\s*condition: \(page\) => page\.fileData\.slug !== "index",\n\s*\}\),\n',
              '\n',
              text,
          )
          text = text.replace('beforeBody: [Component.Breadcrumbs(), Component.ArticleTitle(), Component.ContentMeta()],',
                              'beforeBody: [Component.ArticleTitle(), Component.ContentMeta()],')
          text = text.replace(
              'Component.Graph(),',
              'Component.Graph({ localGraph: { depth: 3 } }),'
          )
          layout.write_text(text, encoding="utf-8")
          PY

      - name: Apply theme preset C1
        run: |
          python3 - <<'PY'
          from pathlib import Path

          cfg_path = Path("quartz-src/quartz.config.ts")
          cfg = cfg_path.read_text(encoding="utf-8")
          cfg = cfg.replace('locale: "zh-CN"', 'locale: "en-US"')
          cfg = cfg.replace('header: "Schibsted Grotesk"', 'header: "Noto Serif SC"')
          cfg = cfg.replace('body: "Source Sans Pro"', 'body: "Noto Sans SC"')
          cfg = cfg.replace('code: "IBM Plex Mono"', 'code: "JetBrains Mono"')
          cfg = cfg.replace('secondary: "#284b63"', 'secondary: "#2f6f7e"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#5fa08e"')
          cfg = cfg.replace('secondary: "#7b97aa"', 'secondary: "#8bc2cf"')
          cfg = cfg.replace('tertiary: "#84a59d"', 'tertiary: "#7fd7be"')
          cfg_path.write_text(cfg, encoding="utf-8")

          css_path = Path("quartz-src/quartz/styles/custom.scss")
          css = (
              '@use "./base.scss";\n\n'
              '/* C preset: garden-network visual style */\n'
              ':root {\n'
              '  --radius-soft: 10px;\n'
              '}\n\n'
              '.page-title,\n'
              'h1, h2, h3 {\n'
              '  letter-spacing: 0.01em;\n'
              '}\n\n'
              'a.internal {\n'
              '  text-underline-offset: 0.18em;\n'
              '  text-decoration-thickness: 0.08em;\n'
              '}\n\n'
              '.popover,\n'
              '.backlinks,\n'
              '.toc,\n'
              '.recent-notes {\n'
              '  border-radius: var(--radius-soft);\n'
              '  border: 1px solid var(--lightgray);\n'
              '  box-shadow: 0 3px 14px color-mix(in srgb, var(--dark) 8%, transparent);\n'
              '}\n\n'
              '.graph,\n'
              '#graph-container {\n'
              '  border-radius: var(--radius-soft);\n'
              '  border: 1px solid var(--lightgray);\n'
              '  background:\n'
              '    radial-gradient(circle at 15% 10%, color-mix(in srgb, var(--tertiary) 18%, transparent), transparent 40%),\n'
              '    radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--secondary) 18%, transparent), transparent 38%);\n'
              '}\n\n'
              '/* hard-fix: keep explorer text visible */\n'
              '.explorer, .explorer * {\n'
              '  color: var(--dark) !important;\n'
              '  opacity: 1 !important;\n'
              '}\n'
              '.explorer-content {\n'
              '  overflow-x: hidden;\n'
              '}\n'
              '.explorer-content a {\n'
              '  white-space: normal;\n'
              '  word-break: break-word;\n'
              '}\n'
          )
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Install Quartz dependencies
        working-directory: quartz-src
        run: npm ci

      - name: Build Quartz site
        working-directory: quartz-src
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz-src/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
